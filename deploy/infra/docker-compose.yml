services:
  odoo_web:
    image: odoo:19
    container_name: odoo_web
    volumes:
      - ./msolutions_custom:/mnt/msolutions_custom
      - ./config/odoo-web.conf:/etc/odoo/odoo.conf:ro
      - ./filestore:/var/lib/odoo
      - ./logs/odoo:/var/log/odoo
    ports:
      - "127.0.0.1:8069:8069"
    restart: always

  # Free-trial customers (website signups, 15 days). Same image/addons/filestore
  # and the same databases as odoo_web -- only the resources differ. nginx routes
  # a tenant here while it is on trial and to odoo_web once it is promoted to
  # Active (see deploy/update_tenant_list.sh). Config: config/odoo-trial.conf.
  odoo_trial:
    image: odoo:19
    container_name: odoo_trial
    volumes:
      - ./msolutions_custom:/mnt/msolutions_custom
      - ./config/odoo-trial.conf:/etc/odoo/odoo.conf:ro
      - ./filestore:/var/lib/odoo
      - ./logs/odoo:/var/log/odoo
    mem_limit: 2g
    cpus: 1.0
    restart: always

  odoo_gevent:
    image: odoo:19
    container_name: odoo_gevent
    volumes:
      - ./msolutions_custom:/mnt/msolutions_custom
      - ./config/odoo-gevent.conf:/etc/odoo/odoo.conf:ro
      - ./filestore:/var/lib/odoo
      - ./logs/odoo:/var/log/odoo
    ports:
      - "127.0.0.1:8072:8072"
    restart: always

  odoo_worker:
    image: odoo:19
    container_name: odoo_worker
    command: odoo --no-http
    volumes:
      - ./msolutions_custom:/mnt/msolutions_custom
      - ./config/odoo-worker.conf:/etc/odoo/odoo.conf:ro
      - ./filestore:/var/lib/odoo
      - ./logs/odoo:/var/log/odoo
    restart: always

  nginx:
    image: nginx:alpine
    container_name: odoo_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html:rw
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - odoo_web
      - odoo_trial
      - odoo_gevent
      - odoo_worker
    restart: always

  redis:
    image: redis:7-alpine
    container_name: odoo_redis
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis:/data
    restart: always
