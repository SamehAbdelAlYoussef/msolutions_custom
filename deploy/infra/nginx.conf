events {
    worker_connections 1024;
}

http {
    map_hash_bucket_size 128;

    map $host $valid_tenant {
        default 0;
        include /etc/nginx/conf.d/tenants.conf;
    }

    map $host $suspended_tenant {
        default 0;
        include /etc/nginx/conf.d/suspended.conf;
    }

    map $host $maintenance_tenant {
        default 0;
        include /etc/nginx/conf.d/maintenance.conf;
    }

    # --- trial / active routing (generated lists, see update_tenant_list.sh) ---
    # trial.conf:   "<tenant>.<domain> <days left>;"  -> served by odoo_trial
    # expired.conf: "<tenant>.<domain> 1;"            -> 'trial ended' page
    map $host $trial_days {
        default "";
        include /etc/nginx/conf.d/trial.conf;
    }

    map $host $expired_tenant {
        default 0;
        include /etc/nginx/conf.d/expired.conf;
    }

    map $trial_days $tenant_upstream {
        default odoo_trial_servers;
        "" odoo_servers;
    }

    # Only trial pages are rewritten, so only they need an uncompressed upstream.
    map $trial_days $ms_trial_ae {
        default "";
        "" $http_accept_encoding;
    }

    # Banner injected into trial tenants' HTML: "your trial ends in N days".
    map $trial_days $ms_trial_inject {
        default '<script>window.MS_TRIAL_DAYS=$trial_days;</script><script src="/ms-trial-banner.js" defer></script>';
        "" "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_max_body_size 200M;

    # --- gzip compression (added 2026-10-16 for perf: Odoo CSS/JS bundles were served raw) ---
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/x-javascript application/json application/xml application/rss+xml application/xhtml+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;


    upstream odoo_servers {
        server odoo_web:8069;
        keepalive 64;
    }

    upstream odoo_trial_servers {
        server odoo_trial:8069;
        keepalive 32;
    }

    upstream odoo_websocket {
        server odoo_gevent:8072;
        keepalive 64;
    }

    # HTTP - Redirect to HTTPS
    server {
        listen 80;
        server_name ~^(?<dbname>.+)\.msolutions-eg\.com$;

        if ($valid_tenant = 0) {
            return 404;
        }

        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name msolutions-eg.com www.msolutions-eg.com;
        return 301 https://$host$request_uri;
    }

    # Main Domain (HTTPS)
    server {
        listen 443 ssl;
        http2 on;
        server_name msolutions-eg.com www.msolutions-eg.com;

        ssl_certificate /etc/letsencrypt/live/msolutions-eg.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/msolutions-eg.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location /websocket {
            proxy_pass http://odoo_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host msolutions.msolutions-eg.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location /longpolling/poll {
            proxy_pass http://odoo_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host msolutions.msolutions-eg.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }

        # Block Odoo database-management endpoints (defense in depth;
        # list_db is already False). Regex location wins over prefix.
        location ~ ^/web/database/(manager|create|duplicate|drop|restore|backup|change_password) { return 404; }

        location / {
            proxy_pass http://odoo_servers;
            proxy_set_header Host msolutions.msolutions-eg.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* /web/static/ {
            proxy_pass http://odoo_servers;
            expires max;
            add_header Cache-Control "public, immutable";
        }
    }

    # ★★★ Client Subdomains (HTTPS) ★★★
    server {
        listen 443 ssl;
        http2 on;
        server_name ~^(?<dbname>.+)\.msolutions-eg\.com$;

        ssl_certificate /etc/letsencrypt/live/msolutions-eg.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/msolutions-eg.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # ★★★ صفحة 404 المخصصة ★★★
        error_page 404 /tenant_not_found.html;
        location = /tenant_not_found.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ★★★ صفحة تجاوز الحد (Storage limit) ★★★
        error_page 402 /quota_exceeded.html;
        location = /quota_exceeded.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Trial ended (403) -- the customer must be promoted to Active.
        error_page 403 /trial_expired.html;
        location = /trial_expired.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Trial banner script (injected into trial tenants' pages only).
        location = /ms-trial-banner.js {
            root /usr/share/nginx/html;
            expires 1h;
        }

        # Under-restore maintenance (503) -- served during a restore swap window
        error_page 503 /maintenance.html;
        location = /maintenance.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ★★★ WebSocket ★★★
        location /websocket {
            proxy_pass http://odoo_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # ★★★ Long Polling ★★★
        location /longpolling/poll {
            proxy_pass http://odoo_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }

        # ★★★ الـ location الرئيسي مع التحقق ★★★
        # Block Odoo database-management endpoints (defense in depth;
        # list_db is already False). Regex location wins over prefix.
        location ~ ^/web/database/(manager|create|duplicate|drop|restore|backup|change_password) { return 404; }

        location / {
            # التحقق من التينانت
            if ($valid_tenant = 0) {
                return 404;
            }
            if ($maintenance_tenant) {
                return 503;
            }
            # تجاوز حد التخزين -> صفحة الترقية
            if ($suspended_tenant) {
                return 402;
            }
            # انتهت الفترة التجريبية
            if ($expired_tenant) {
                return 403;
            }

            # trial tenants -> odoo_trial (small), everyone else -> odoo_web
            proxy_pass http://$tenant_upstream;
            proxy_set_header Accept-Encoding $ms_trial_ae;
            sub_filter '</body>' '$ms_trial_inject</body>';
            sub_filter_once on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* /web/static/ {
            proxy_pass http://odoo_servers;
            expires max;
            add_header Cache-Control "public, immutable";
        }
    }
}
