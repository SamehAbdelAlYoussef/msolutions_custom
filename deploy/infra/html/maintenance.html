<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under maintenance</title>
<style>
 body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef2f7;
   color:#0f172a;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
 .card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;max-width:520px;
   padding:40px 36px;text-align:center;box-shadow:0 20px 50px -20px rgba(15,23,42,.25)}
 h1{font-size:22px;margin:0 0 10px} p{color:#64748b;line-height:1.6;margin:.4rem 0}
 .spin{width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;
   margin:0 auto 20px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body><div class="card">
 <div class="spin"></div>
 <h1>Under maintenance</h1>
 <p>This workspace is being restored to an earlier backup. It will be back in a few moments &mdash; your data is safe.</p>
 <p style="font-size:13px" dir="rtl">تتم استعادة بياناتك من نسخة احتياطية. سيعود العمل خلال لحظات &mdash; بياناتك آمنة.</p>
</div></body></html>
