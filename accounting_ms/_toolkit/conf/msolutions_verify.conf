[options]
; msolutions accounting port - self-contained Community verification.
;
; ORDER MATTERS. Odoo resolves a module by the FIRST addons_path entry that
; contains it. Community ships 15 modules that the port also contains
; (account, account_payment, account_edi_ubl_cii, ...). Those Community copies
; are authoritative - other Community modules (e.g. purchase_edi_ubl_bis3)
; import their API - so Community must come FIRST.
;
; The port still wins for everything Community does not ship: the msolutions
; compatibility shims (account_reports, account_fiscal_categories,
; stock_accountant, account_bank_statement_import) and the Enterprise-only
; modules. In a production config, keep any Enterprise tree AFTER the port so
; the shims override it:
;     <odoo/addons>,<addons>,<accounting_ms>,<custom/addions_enterprise>
addons_path = /home/sameh/odoo_source/odoo19/odoo/addons,/home/sameh/odoo_source/odoo19/addons,/home/sameh/odoo_source/odoo19/msolutions_custom/accounting_ms
db_user = sameh
db_host = /var/run/postgresql
; Dedicated port: 8069 is occupied by another running test instance.
http_port = 8070
workers = 0
log_level = info
list_db = True
admin_passwd = 123
