<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Subtle radial highlight so the background reads as deep, not flat -->
    <radialGradient id="bg" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#163854"/>
      <stop offset="100%" stop-color="#0D2B45"/>
    </radialGradient>
  </defs>

  <!-- Navy rounded-square background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Bold geometric M — 14 px pillar width, variable-contrast diagonals
       give a calligraphic quality without a serif.
       Outer corners at y=24; centre peak at y=53; inner valley at y=66. -->
  <path fill="#FFFFFF"
        d="M 20,104
           L 20,24
           L 64,53
           L 108,24
           L 108,104
           L 94,104
           L 94,40
           L 64,66
           L 34,40
           L 34,104
           Z"/>

  <!-- Teal node at the M crown — the mark that makes this M unmistakable.
       Represents a live tenant / active connection point. -->
  <circle cx="64" cy="53" r="7.5" fill="#00A693"/>

  <!-- Teal baseline bar — brand underline, keeps the bottom anchored -->
  <rect x="44" y="111" width="40" height="5" rx="2.5" fill="#00A693" opacity="0.65"/>

</svg>
